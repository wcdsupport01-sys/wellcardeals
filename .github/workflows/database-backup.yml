name: Encrypted database backup
on:
  schedule:
    # 02:00 Asia/Kolkata every day. GitHub schedules are best effort.
    - cron: '30 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check encryption and failure handling
        run: |
          node tests/backup-crypto.test.mjs
          node tests/backup-create.test.mjs
      - name: Export, verify and encrypt database
        env:
          WCD_BACKUP_PROJECT_REF: zdbtlwdjmpvcmwsnkopc
          WCD_BACKUP_READ_TOKEN: ${{ secrets.WCD_BACKUP_READ_TOKEN }}
          WCD_BACKUP_ENCRYPTION_KEY: ${{ secrets.WCD_BACKUP_ENCRYPTION_KEY }}
        run: node scripts/backup/create.mjs backups/wellcardeals-database.wcdbackup
      - name: Retain encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wellcardeals-database-${{ github.run_id }}
          path: backups/*.wcdbackup
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
